name: Build Self-Hosted Components

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Git ref for sync server & web client"
        required: true
        default: "self-hosted-sync-v2"
      cli-ref:
        description: "Git ref for CLI"
        required: true
        default: "feat/cliable"

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  CLOJURE_VERSION: "1.11.1.1435"

jobs:
  build-sync-server:
    name: Build Sync Server
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-sync-${{ hashFiles('deps/db-sync/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-sync-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Cache clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-sync-${{ hashFiles('**/deps.edn') }}

      - name: Install dependencies & build
        run: cd deps/db-sync && yarn install && yarn build:node-adapter

      - name: Prepare Docker context
        run: |
          mkdir -p /tmp/sync-context/worker/dist
          cp -r deps/db-sync/worker/dist/* /tmp/sync-context/worker/dist/
          cp deps/db-sync/package.json deps/db-sync/yarn.lock /tmp/sync-context/
          cp ci/sync-server/Dockerfile /tmp/sync-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sync server image
        uses: docker/build-push-action@v5
        with:
          context: /tmp/sync-context
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/logseq-sync-server:latest

  build-web-client:
    name: Build Web Client
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-web-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-web-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Cache clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-web-${{ hashFiles('**/deps.edn') }}

      - name: Install dependencies
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Compile CLJS and web bundles
        run: gulp build && ENABLE_DB_SYNC_LOCAL=true yarn cljs:release && yarn webpack-app-build

      - name: Prepare Docker context
        run: |
          mkdir -p /tmp/web-context
          cp -r static /tmp/web-context/static
          cp ci/web-client/Dockerfile /tmp/web-context/Dockerfile
          cp ci/web-client/nginx.conf /tmp/web-context/nginx.conf

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web client image
        uses: docker/build-push-action@v5
        with:
          context: /tmp/web-context
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/logseq-web:latest

  build-cli:
    name: Build CLI
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.cli-ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-cli-${{ hashFiles('deps/cli/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-cli-

      - name: Setup Babashka
        uses: turtlequeue/setup-babashka@v1.4.0
        with:
          babashka-version: "1.12.215"

      - name: Install dependencies
        run: cd deps/cli && yarn install

      - name: Build vendor deps
        run: cd deps/cli && if [ ! -d vendor/src ] || [ -z "$(ls -A vendor/src)" ]; then bb build:vendor-nbb-deps; fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-cli
          path: deps/cli/
          retention-days: 30
