server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Global COOP/COEP headers
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # WASM files
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 1M;
    }

    # JS modules
    location ~* \.(js|mjs)$ {
        default_type application/javascript;
        expires 1M;
    }

    # Other static assets
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1M;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://logseq-sync:8787/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /sync/ {
        proxy_pass http://logseq-sync:8787/sync/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /graphs {
        proxy_pass http://logseq-sync:8787/graphs;
        proxy_http_version 1.1;
    }

    location ^~ /graphs/ {
        proxy_pass http://logseq-sync:8787/graphs/;
        proxy_http_version 1.1;
    }

    location ^~ /e2ee {
        proxy_pass http://logseq-sync:8787/e2ee;
        proxy_http_version 1.1;
    }

    location ^~ /e2ee/ {
        proxy_pass http://logseq-sync:8787/e2ee/;
        proxy_http_version 1.1;
    }

    location ^~ /assets {
        proxy_pass http://logseq-sync:8787/assets;
        proxy_http_version 1.1;
    }

    location ^~ /assets/ {
        proxy_pass http://logseq-sync:8787/assets/;
        proxy_http_version 1.1;
    }
}
